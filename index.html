    <!-- Pre-hydration theme resolver & transition guard -->
    <style>
      /* Prevent theme flash on load */
      html {
        transition: none !important;
      }
      .theme-transition {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Improve button accessibility */
      button:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid hsl(var(--ring));
        outline-offset: 2px;
      }
      /* Prevent theme transitions during initial paint */
      html.theme-resolving *, html.theme-resolving *::before, html.theme-resolving *::after {
        transition: none !important;
        animation: none !important;
      }
    </style>
  <!-- Optional module script: expose Vite env to the IIFE so consumers can disable the fix at build time -->
  <script type="module">
    try {
      // import.meta.env is only available in module scripts. Treat the string 'false' as explicit false.
      window.__ENABLE_THEME_FLICKER_FIX = import.meta.env.VITE_ENABLE_THEME_FLICKER_FIX !== 'false';
    } catch {}
  </script>

  <script>
    (function () {
      try {
        var meta = document.querySelector('meta[name="enable-theme-flicker-fix"]');
        if (meta && meta.content === 'false') return;
      } catch {}
      if (window.__ENABLE_THEME_FLICKER_FIX === false) return;
      try {
        // mark that theme resolution is in progress
        document.documentElement.classList.add('theme-resolving');
      } catch {}
      try {
        var KEY = 'ui-theme';
        var val = null;
        try { val = localStorage.getItem(KEY); } catch { val = null; }
        // fallback to cookie if localStorage is blocked
        if (!val) {
          try {
            var m = document.cookie.match('(?:^|; )' + KEY + '=([^;]*)');
            if (m) val = decodeURIComponent(m[1]);
          } catch {}
        }
        if (!val) val = 'system';
        if (!/^(light|dark|system)$/.test(val)) val = 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = val === 'system' ? (prefersDark ? 'dark' : 'light') : val;
        var de = document.documentElement;
        de.classList.remove('light', 'dark');
        de.classList.add(theme);
        if (val === 'system') de.classList.add('system'); else de.classList.remove('system');
      } catch {
        try {
          var de2 = document.documentElement;
          var prefersDark2 = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          de2.classList.add(prefersDark2 ? 'dark' : 'light');
        } catch {}
      } finally {
        try { document.documentElement.classList.remove('theme-resolving'); } catch {}
      }
    })();
  </script>

  <!-- Consent-gated analytics bootstrap.
       GTM, GA4, and Amplitude load ONLY after the visitor opts in via the
       cookie consent banner. The 'cookie-consent' key/version literals are
       duplicated in src/utils/cookieConsent.ts — keep them in sync. -->
  <script>
    (function () {
      var KEY = 'cookie-consent';
      var VERSION = 2;

      // Google Consent Mode v2 defaults, queued before any Google script
      // could possibly run.
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });

      function readConsent() {
        var raw = null;
        try { raw = localStorage.getItem(KEY); } catch (e) { }
        if (!raw) {
          try {
            var m = document.cookie.match('(?:^|; )' + KEY + '=([^;]*)');
            if (m) raw = decodeURIComponent(m[1]);
          } catch (e) { }
        }
        if (!raw) return null;
        try {
          var parsed = JSON.parse(raw);
          return parsed && parsed.version === VERSION &&
            typeof parsed.analytics === 'boolean' &&
            typeof parsed.doNotSell === 'boolean' ? parsed : null;
        } catch (e) { return null; }
      }

      var loaded = false;
      window.__loadAnalytics = function () {
        if (loaded) return;
        loaded = true;

        window.gtag('consent', 'update', { analytics_storage: 'granted' });

        // Google Tag Manager
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-MHM2XTTV';
        document.head.appendChild(gtm);

        // GA4 direct fallback
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-KKQJ9P2ECC';
        document.head.appendChild(ga);
        window.gtag('js', new Date());
        window.gtag('config', 'G-KKQJ9P2ECC');

        // Amplitude Analytics & Session Replay — init runs in onload since
        // the CDN script is injected asynchronously.
        var amp = document.createElement('script');
        amp.src = 'https://cdn.amplitude.com/script/f8e22b9e6a107073fe8cb51424e63488.js';
        amp.onload = function () {
          if (!window.amplitude) return;
          if (window.sessionReplay) {
            window.amplitude.add(window.sessionReplay.plugin({
              sampleRate: 1,
              config: {
                captureRageClicks: true,
                captureDeadClicks: true,
              },
              logLevel: 3,
            }));
          }
          window.amplitude.init('f8e22b9e6a107073fe8cb51424e63488', { "fetchRemoteConfig": true, "autocapture": true });
        };
        document.head.appendChild(amp);
      };

      // Opt-out model: analytics runs by default unless the visitor opted
      // out (analytics off or do-not-sell on) or sends a Global Privacy
      // Control signal.
      var stored = readConsent();
      var allowed = stored
        ? (stored.analytics === true && stored.doNotSell !== true)
        : navigator.globalPrivacyControl !== true;
      if (allowed) {
        window.__loadAnalytics();
      }
    })();
  </script>

  <!-- JS Error Tracking -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      if (window.amplitude && window.amplitude.track) {
        window.amplitude.track('js_error', {
          message: String(msg),
          source: src,
          line: line,
          column: col,
          error: err ? String(err.stack || err) : null,
        });
      }
    };
    window.addEventListener('unhandledrejection', function(e) {
      if (window.amplitude && window.amplitude.track) {
        window.amplitude.track('js_unhandled_rejection', {
          reason: e.reason ? String(e.reason.stack || e.reason) : String(e.reason),
        });
      }
    });
  </script>
